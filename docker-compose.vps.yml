services:
  golfpro-companion:
    container_name: golfpro-companion
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY:-}
    ports:
      # Default binding keeps app private to this server (no public exposure),
      # preventing accidental interference with other public apps on 80/443.
      - "${GOLFPRO_BIND_IP:-127.0.0.1}:${GOLFPRO_HOST_PORT:-8087}:80"
    restart: unless-stopped
